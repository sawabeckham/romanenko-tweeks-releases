# Новая версия приходит коммитом с папкой releases/<версия> и тегом v<версия> — делаем из неё релиз GitHub.
name: Релиз
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" releases/"$v"/*.pkg releases/"$v"/*.zip \
            --title "Romanenko Tweeks $v" --notes-file releases/"$v"/notes.md
